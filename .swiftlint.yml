# PhotoStyler lint configuration.
included:
  - PhotoStyler
  - PhotoStylerTests
  - PhotoStylerUITests

disabled_rules:
  - trailing_whitespace   # handled by SwiftFormat
  - todo

opt_in_rules:
  - empty_count
  - closure_spacing
  - explicit_init
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - redundant_nil_coalescing
  - sorted_imports
  - unneeded_parentheses_in_closure_argument

line_length:
  warning: 120
  error: 160
  ignores_comments: true

type_body_length:
  warning: 350
  error: 500

file_length:
  warning: 500
  error: 800

identifier_name:
  min_length: 1          # r, g, b, a are the right names in colour code
  excluded: [id, x, y, c]

force_unwrapping:
  severity: warning
